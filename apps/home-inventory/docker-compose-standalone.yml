# Home Asset + Warranty — standalone variant: runs its OWN PostgreSQL
# container instead of reusing the shared one. Everything else (Caddy,
# uploads volume, hardening) is unchanged from docker-compose.yml.
#
# To switch an existing deployment: dump the home_inventory database from
# shared-postgres and restore it into the new "db" service below, then swap
# this file in for docker-compose.yml. A fresh install needs no dump — the
# app creates its own schema on first start (backend/migrations), same as
# it does today against shared-postgres. db/init-db.sh is NOT needed here;
# that script only bootstraps a role+database on the shared container.
#
#   cp .env.example .env && nano .env   # DB_PASSWORD is reused for the new db service too
#   docker compose -f docker-compose-standalone.yml up -d --build
#
# Set CADDY_NETWORK in .env to your existing Caddy network, same as docker-compose.yml.

services:
  db:
    image: postgres:16-alpine
    container_name: home-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-home_inventory}
      POSTGRES_USER: ${DB_USER:-home_inventory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-home_inventory_user} -d ${DB_NAME:-home_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dbnet
    mem_limit: 400m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  app:
    build: .
    image: home-inventory:latest
    container_name: home-inventory
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /data/uploads
      DB_HOST: db   # overrides .env's shared-postgres — talk to the "db" service above instead
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/data/uploads          # the ONLY state besides the db: invoice files
    networks:
      - caddy
      - dbnet
    # No ports published: Caddy reaches the app as http://home-inventory:8000 on the shared network.
    # For LAN debugging only, uncomment:
    # ports: ["127.0.0.1:8090:8000"]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
  dbnet:   # internal — just app <-> its own db, not the shared one

volumes:
  db_data:
