# Home Asset + Warranty
# Only ONE container. Reuses the existing shared PostgreSQL and Caddy — neither is created here.
#
#   cp .env.example .env && nano .env
#   ./db/init-db.sh              # once: creates role + database on shared-postgres
#   docker compose up -d --build
#
# Set CADDY_NETWORK / DB_NETWORK in .env to the names of your existing Docker networks
# (see: docker network ls ; docker inspect shared-postgres --format '{{json .NetworkSettings.Networks}}').

services:
  app:
    build: .
    image: home-inventory:latest
    container_name: home-inventory
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./data/uploads:/data/uploads          # the ONLY state: invoice files (back this up with the DB)
    networks:
      - caddy
      - db
    # No ports published: Caddy reaches the app as http://home-inventory:8000 on the shared network.
    # For LAN debugging only, uncomment:
    # ports: ["127.0.0.1:8090:8000"]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
  db:
    external: true
    name: ${DB_NETWORK:-postgres}
