# Personal Finance Tracker — Raspberry Pi 5 / Docker Compose stack
# All services bind to 127.0.0.1 only. External access is via the host-level
# cloudflared tunnel (see cloudflare/config.yml.example) — no router port
# forwarding, no ports exposed on the LAN interface.

services:
  ### Shared DB servers used, if required to dedicated db rename docker-compose-standalone.yml to docker-compose.yml
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finance-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finance_db_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${POSTGRES_REMOTE_HOST:-shared-postgres}:5432/${POSTGRES_DB:-finance_db}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://finance.example.com}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - app_uploads:/app/uploads
    ports:
      - "127.0.0.1:8090:8000"   # direct debug access only; public traffic comes via shared-caddy
    networks:
      - shared-db    # reach shared-postgres:5432
      - shared-web   # reachable by shared-caddy as finance-app:8000
    deploy:
      resources:
        limits:
          memory: 500M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  app_uploads:

# Created by Pi5Lab/shared-infra (postgres and caddy stacks) — start those first.
networks:
  shared-db:
    external: true
  shared-web:
    external: true